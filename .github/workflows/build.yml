name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Basic Gradle Files
      run: |
        echo "include ':app'" > settings.gradle
        mkdir -p app
        echo "apply plugin: 'com.android.application'" > app/build.gradle
        echo "android { namespace 'org.sgod.jioai'; compileSdk 34; defaultConfig { applicationId 'org.sgod.jioai'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' } }" >> app/build.gradle

    - name: Download Gradle Wrapper / Build Project
      run: |
        gradle wrapper
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK Release
      uses: actions/upload-artifact@v4
      with:
        name: Radhe-Admin-APK
        path: app/build/outputs/apk/debug/app-debug.apk
