<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- 
  Viewport Meta Tag:
  user-scalable=no prevents accidental zooming on double-tap
  initial-scale=1.0 ensures 1:1 pixel mapping
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030711">

<title>VIP S_God Predictor</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --green: #00ff80;
    --cyan: #00eaff;
    --bg: #030711;
}

/* 
  HTML & Body: 
  Remove default margins. 
  Use fixed dimensions matching your Kotlin LayoutParams (380x420).
  This prevents any "jitter" or resize issues in WebView.
*/
html, body {
    width: 380px;
    height: 420px;
    margin: 0;
    padding: 0;
    background: var(--bg); /* Fallback background */
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden; /* Prevent body scroll */
    touch-action: manipulation; /* Prevent double-tap zoom delay */
}

/* 
  App Container:
  Takes full space. 
  No border-radius on the main container because the Native View 
  (FrameLayout) is rectangular. 
  If you want rounded corners, you must make the Native View 
  transparent and use a CardView in XML, OR keep this square.
  
  For now, we keep it square to match the 380x420 window perfectly.
*/
.app {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 12px 14px;
    /* 
      Scroll Logic:
      Only scroll if content overflows.
      -webkit-overflow-scrolling: touch enables momentum scrolling on older Androids.
    */
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(160deg, #081727, #050a14 65%);
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* Top-aligned to ensure drag handle is always visible */
}

/* Hide Scrollbar but keep scroll functionality */
.app::-webkit-scrollbar {
    width: 0px;
    background: transparent;
}

/* 
  Header:
  This area should align with the 48px Native Drag Handle.
  If your Native Handle is 48px high, make this header at least 48px tall
  or ensure the padding accounts for it.
*/
.header {
    text-align: center;
    padding: 2px 0 4px;
    min-height: 48px; /* Matches Native Drag Handle Height */
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex-shrink: 0; /* Prevent header from shrinking on scroll */
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--green);
    text-shadow: 0 0 8px #00ff80;
}

.subtitle {
    margin-top: 2px;
    font-size: 8px;
    letter-spacing: 1.5px;
    color: #9cb8c7;
}

.badge {
    display: inline-block;
    margin-top: 4px;
    padding: 3px 8px;
    border: 1px solid #00ff8070;
    border-radius: 20px;
    color: var(--green);
    background: #00ff8010;
    font-size: 8px;
    letter-spacing: 1px;
}

.status {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 6px;
    margin-bottom: 6px;
    border: 1px solid #1a3c48;
    border-radius: 8px;
    background: #06121c;
    font-size: 9px;
    color: #b3cad6;
    flex-shrink: 0;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
}

.result-card {
    position: relative;
    padding: 10px 8px;
    text-align: center;
    border: 1.5px solid #00ff8055;
    border-radius: 12px;
    background: #06111a;
    overflow: hidden;
    flex-shrink: 0;
}

.wings {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
}

.wing {
    width: 45px;
    height: 18px;
    border-top: 2px solid var(--green);
    border-bottom: 1px solid #00ff8070;
    background: linear-gradient(180deg, #00ff8035, transparent);
}

.wing.left { clip-path: polygon(0 0, 100% 25%, 75% 50%, 100% 75%, 0 100%, 25% 50%); }
.wing.right { clip-path: polygon(0 25%, 100% 0, 75% 50%, 100% 100%, 0 75%, 25% 50%); }

.label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #a5d9bf;
}

.number {
    margin: 4px 0;
    font-size: 50px;
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 10px #00ff80;
}

.number.rolling { animation: numberGlow .12s infinite alternate; }
.number.pop { animation: pop .5s ease-out; }

@keyframes numberGlow {
    from { opacity: .65; transform: scale(.96); }
    to { opacity: 1; transform: scale(1.04); }
}

@keyframes pop {
    0% { opacity: 0; transform: scale(.2); }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.prediction {
    display: inline-block;
    min-width: 130px;
    padding: 6px 12px;
    border: 1.5px solid var(--green);
    border-radius: 8px;
    color: var(--green);
    background: #00ff8012;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
}

.prediction.red { color: #ff496a; border-color: #ff496a; background: #ff174412; }
.prediction.green { color: #00ff80; border-color: #00ff80; background: #00ff8012; }
.prediction.violet { color: #c68aff; border-color: #c68aff; background: #9b42ff12; }

.result-caption {
    margin-top: 4px;
    font-size: 8px;
    color: #8ea5b7;
}

.popup {
    position: relative;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid #00eaff70;
    border-radius: 10px;
    background: #071827;
    text-align: center;
    opacity: .8;
    flex-shrink: 0;
}

.popup.show { opacity: 1; }

.popup-title { color: var(--cyan); font-size: 9px; letter-spacing: 1px; }
.popup-value { margin-top: 2px; font-size: 14px; font-weight: 900; }
.popup-detail { font-size: 9px; color: #91b6c5; }

.controls { margin-top: 8px; flex-shrink: 0; }

button {
    width: 100%;
    min-height: 38px;
    padding: 6px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(100deg, #00ff80, #00eaff);
    color: #03120e;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    /* Prevent button text selection on long press */
    user-select: none;
    -webkit-user-select: none;
}

button:active { transform: scale(.98); }

.secondary {
    margin-top: 6px;
    min-height: 32px;
    color: #b7d2df;
    border: 1px solid #29414e;
    background: #0a1621;
    font-size: 10px;
}

.footer {
    margin-top: 6px;
    text-align: center;
    color: #718a99;
    font-size: 8px;
    flex-shrink: 0;
}
</style>
</head>

<body>

<main class="app">
    <!-- 
      Note: The top 48px of this area is covered by the Native Drag Handle.
      Ensure your content starts below that or the drag handle is semi-transparent.
    -->
    <header class="header">
        <div class="logo">⚡ S_GOD ⚡</div>
        <div class="subtitle">PREMIUM ANIMATION SYSTEM</div>
        <div class="badge">✦ NEON EDITION ✦</div>
    </header>

    <div class="status">
        <span class="dot"></span>
        <span id="status">SYSTEM READY</span>
    </div>

    <section class="result-card">
        <div class="wings">
            <div class="wing left"></div>
            <div class="label">RESULT</div>
            <div class="wing right"></div>
        </div>
        <div class="label">NUMBER DISPLAY</div>
        <div class="number" id="number">?</div>
        <div class="prediction" id="prediction">READY</div>
        <div class="result-caption" id="caption">PRESS START TO PLAY ANIMATION</div>
    </section>

    <section class="popup" id="popup">
        <div class="popup-title">✦ RESULT SHOWCASE ✦</div>
        <div class="popup-value" id="popupValue">Waiting for animation</div>
        <div class="popup-detail" id="popupDetail">Number and colour visual demo</div>
    </section>

    <div class="controls">
        <button id="startBtn" type="button">⚡ START ANIMATION</button>
        <button class="secondary" id="resetBtn" type="button">↻ RESET</button>
    </div>

    <footer class="footer">S_GOD • NEON ANIMATION UI</footer>
</main>

<script>
"use strict";

const numberEl = document.getElementById("number");
const predictionEl = document.getElementById("prediction");
const statusEl = document.getElementById("status");
const captionEl = document.getElementById("caption");
const popupEl = document.getElementById("popup");
const popupValueEl = document.getElementById("popupValue");
const popupDetailEl = document.getElementById("popupDetail");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");

let running = false;
let intervalId = null;

function setNumberStyle(number) {
    predictionEl.classList.remove("red", "green", "violet");
    let colour;
    if ([1, 3, 7, 9].includes(number)) {
        colour = "GREEN";
        predictionEl.classList.add("green");
    } else if ([2, 4, 6, 8].includes(number)) {
        colour = "RED";
        predictionEl.classList.add("red");
    } else {
        colour = "VIOLET";
        predictionEl.classList.add("violet");
    }
    const size = number >= 5 ? "BIG" : "SMALL";
    return { colour, size };
}

function startAnimation() {
    if (running) return;
    running = true;
    startBtn.disabled = true;
    resetBtn.disabled = true;

    statusEl.textContent = "ANIMATION RUNNING...";
    captionEl.textContent = "GENERATING VISUAL EFFECTS...";
    popupEl.classList.remove("show");

    predictionEl.textContent = "LOADING";
    popupValueEl.textContent = "Please wait...";
    popupDetailEl.textContent = "Number animation in progress";

    numberEl.classList.remove("pop");
    numberEl.classList.add("rolling");

    let ticks = 0;
    const maxTicks = 30;

    intervalId = setInterval(() => {
        const n = Math.floor(Math.random() * 10);
        numberEl.textContent = n;
        ticks++;

        if (ticks >= maxTicks) {
            clearInterval(intervalId);
            intervalId = null;

            const finalNumber = Math.floor(Math.random() * 10);
            const result = setNumberStyle(finalNumber);

            numberEl.textContent = finalNumber;
            numberEl.classList.remove("rolling", "pop");
            void numberEl.offsetWidth;
            numberEl.classList.add("pop");

            predictionEl.textContent = result.size;
            popupValueEl.textContent = result.size + " • " + result.colour;
            popupDetailEl.textContent = "Demo number: " + finalNumber + " | Visual result only";
            captionEl.textContent = "NUMBER " + finalNumber + " • DEMO RESULT";
            statusEl.textContent = "ANIMATION COMPLETE";
            popupEl.classList.add("show");

            startBtn.disabled = false;
            resetBtn.disabled = false;
            startBtn.textContent = "↻ PLAY AGAIN";
            running = false;
        }
    }, 90);
}

function resetAnimation() {
    if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
    }
    running = false;
    numberEl.classList.remove("rolling", "pop");
    predictionEl.classList.remove("red", "green", "violet");
    numberEl.textContent = "?";
    predictionEl.textContent = "READY";
    statusEl.textContent = "SYSTEM READY";
    captionEl.textContent = "PRESS START TO PLAY ANIMATION";
    popupValueEl.textContent = "Waiting for animation";
    popupDetailEl.textContent = "Number and colour visual demo";
    popupEl.classList.remove("show");
    startBtn.disabled = false;
    resetBtn.disabled = false;
    startBtn.textContent = "⚡ START ANIMATION";
}

startBtn.addEventListener("click", startAnimation);
resetBtn.addEventListener("click", resetAnimation);
</script>

</body>
</html>
