<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radhe Admin Panel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: rgba(0, 0, 0, 0.85);
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .panel {
            width: 280px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #00ffcc;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            text-align: center;
        }
        .header {
            font-size: 14px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .period {
            font-size: 12px;
            color: #ffcc00;
            margin-bottom: 8px;
        }
        .result-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #444;
        }
        .big-small {
            font-size: 20px;
            font-weight: bold;
            color: #ff00ff;
            margin-bottom: 4px;
        }
        .digit {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
        }
        .status {
            font-size: 10px;
            color: #00ff00;
            margin-bottom: 8px;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
        }
        button {
            flex: 1;
            margin: 0 4px;
            padding: 6px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .hide-btn { background: #ffaa00; color: #000; }
        .exit-btn { background: #ff4444; color: #fff; }
    </style>
</head>
<body>

    <div class="panel">
        <div class="header">RADHE ADMIN PANEL</div>
        <div class="period" id="periodText">PER: Loading...</div>
        
        <div class="result-box">
            <div class="big-small" id="predictionText">WAIT...</div>
            <div style="font-size: 10px; color: #aaa;">LUCKY DIGIT</div>
            <div class="digit" id="digitText">-</div>
        </div>

        <div class="status">Status: Active (IST Synced)</div>

        <div class="btn-container">
            <button class="hide-btn" onclick="minimizeApp()">HIDE</button>
            <button class="exit-btn" onclick="exitApp()">EXIT</button>
        </div>
    </div>

    <script>
        function updatePanel() {
            // Get current time in IST (UTC + 5:30)
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const istTime = new Date(utc + (3600000 * 5.5));

            const year = istTime.getFullYear();
            const month = String(istTime.getMonth() + 1).padStart(2, '0');
            const day = String(istTime.getDate()).padStart(2, '0');
            
            const hours = istTime.getHours();
            const minutes = istTime.getMinutes();
            const totalMinutesToday = (hours * 60) + minutes;

            // Wingo 1 Min base period calculation formula
            const baseNumber = (hours * 60) + minutes + 1;
            const periodSeq = String(100000000 + totalMinutesToday + 1).slice(1);
            const periodCode = `${year}${month}${day}1000${periodSeq}`;

            document.getElementById("periodText").innerText = `PER: ${periodCode}`;

            // Generate stable pseudo-random prediction based on period
            const lastDigit = parseInt(periodCode.slice(-1));
            const isBig = lastDigit >= 5;

            document.getElementById("predictionText").innerText = isBig ? "BIG" : "SMALL";
            document.getElementById("digitText").innerText = lastDigit;
        }

        // Run immediately and update every second
        updatePanel();
        setInterval(updatePanel, 1000);

        function minimizeApp() {
            if (window.Android && window.Android.minimizePanel) {
                window.Android.minimizePanel();
            }
        }

        function exitApp() {
            if (window.Android && window.Android.closeApp) {
                window.Android.closeApp();
            }
        }
    </script>
</body>
</html>
