<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jio AI Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .panel {
            width: 290px;
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(10, 10, 25, 0.95));
            border: 2px solid #00ffcc;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4), inset 0 0 10px rgba(0, 255, 204, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .header {
            font-size: 14px;
            font-weight: 800;
            color: #00ffcc;
            margin-bottom: 4px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }
        .period {
            font-size: 11px;
            color: #ffcc00;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .result-box {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
        }
        .big-small {
            font-size: 22px;
            font-weight: 900;
            color: #ff00ff;
            margin-bottom: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.6);
            letter-spacing: 1px;
        }
        .digit {
            font-size: 26px;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }
        .status {
            font-size: 10px;
            color: #00ff00;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }
        button {
            flex: 1;
            padding: 7px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }
        .hide-btn { 
            background: linear-gradient(135deg, #ffaa00, #ff8800); 
            color: #000; 
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
        }
        .exit-btn { 
            background: linear-gradient(135deg, #ff4444, #cc0000); 
            color: #fff; 
            box-shadow: 0 0 8px rgba(255, 68, 68, 0.4);
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="header">⚡ JIO AI PRO ⚡</div>
        <div class="period" id="periodText">PER: Loading...</div>
        
        <div class="result-box">
            <div class="big-small" id="predictionText">WAIT...</div>
            <div style="font-size: 9px; color: #888; letter-spacing: 1px;">LUCKY DIGIT</div>
            <div class="digit" id="digitText">-</div>
        </div>

        <div class="status">● Status: AI Synced & Active</div>

        <div class="btn-container">
            <button class="hide-btn" onclick="minimizeApp()">HIDE</button>
            <button class="exit-btn" onclick="exitApp()">EXIT</button>
        </div>
    </div>

    <script>
        function updatePanel() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const istTime = new Date(utc + (3600000 * 5.5));

            const year = istTime.getFullYear();
            const month = String(istTime.getMonth() + 1).padStart(2, '0');
            const day = String(istTime.getDate()).padStart(2, '0');
            
            const hours = istTime.getHours();
            const minutes = istTime.getMinutes();
            const totalMins = (hours * 60) + minutes;

            const periodSeq = 10000 + totalMins + 1;
            const periodCode = `${year}${month}${day}1000${periodSeq}`;

            document.getElementById("periodText").innerText = `PER: ${periodCode}`;

            const lastDigit = parseInt(periodCode.slice(-1));
            const isBig = lastDigit >= 5;

            document.getElementById("predictionText").innerText = isBig ? "BIG" : "SMALL";
            document.getElementById("digitText").innerText = lastDigit;
        }

        updatePanel();
        setInterval(updatePanel, 1000);

        function minimizeApp() {
            if (window.Android && window.Android.minimizePanel) {
                window.Android.minimizePanel();
            }
        }

        function exitApp() {
            if (window.Android && window.Android.closeApp) {
                window.Android.closeApp();
            }
        }
    </script>
</body>
</html>
