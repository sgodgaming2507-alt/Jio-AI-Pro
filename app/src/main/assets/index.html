<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030711">

<title>VIP S_God Predictor</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --green: #00ff80;
    --cyan: #00eaff;
    --bg: #030711;
}

body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.app {
    position: relative;
    isolation: isolate;
    width: 414px;
    height: 520px;
    padding: 16px 14px;
    overflow: hidden;
    border: 2px solid #00ff8070;
    border-radius: 24px;
    background: linear-gradient(160deg, #081727, #050a14 65%);
    box-shadow:
        0 0 25px #00ff8030,
        inset 0 0 25px #00ff8008;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.app::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: -90px;
    left: 50%;
    width: 250px;
    height: 180px;
    transform: translateX(-50%);
    background: #00ff8025;
    filter: blur(55px);
    pointer-events: none;
}

.header {
    text-align: center;
    padding: 2px 0 4px;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--green);
    text-shadow:
        0 0 10px #00ff80,
        0 0 25px #00ff8060;
}

.subtitle {
    margin-top: 2px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #9cb8c7;
}

.badge {
    display: inline-block;
    margin-top: 4px;
    padding: 3px 10px;
    border: 1px solid #00ff8070;
    border-radius: 30px;
    color: var(--green);
    background: #00ff8010;
    font-size: 9px;
    letter-spacing: 1px;
    box-shadow: 0 0 12px #00ff8010;
}

.status {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 6px 6px;
    margin-bottom: 6px;
    border: 1px solid #1a3c48;
    border-radius: 8px;
    background: #06121c;
    font-size: 10px;
    letter-spacing: 1px;
    color: #b3cad6;
}

.dot {
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: dotPulse 1.2s infinite alternate;
}

@keyframes dotPulse {
    from { opacity: .45; }
    to { opacity: 1; }
}

.result-card {
    position: relative;
    padding: 10px 8px;
    text-align: center;
    border: 2px solid #00ff8055;
    border-radius: 14px;
    background:
        radial-gradient(ellipse at center, #06472b65, transparent 75%),
        #06111a;
    overflow: hidden;
    box-shadow: inset 0 0 25px #00ff800b;
}

.result-card::before,
.result-card::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 2px;
    top: 12px;
    background: linear-gradient(
        90deg, transparent, var(--green), transparent
    );
    box-shadow: 0 0 12px var(--green);
}

.result-card::before {
    left: -15px;
    transform: rotate(35deg);
}

.result-card::after {
    right: -15px;
    transform: rotate(-35deg);
}

.wings {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
}

.wing {
    width: 50px;
    height: 20px;
    border-top: 2px solid var(--green);
    border-bottom: 1px solid #00ff8070;
    background: linear-gradient(180deg, #00ff8035, transparent);
    filter: drop-shadow(0 0 8px #00ff80);
    animation: wingPulse 1.5s infinite alternate;
}

.wing.left {
    clip-path: polygon(
        0 0, 100% 25%, 75% 50%,
        100% 75%, 0 100%, 25% 50%
    );
}

.wing.right {
    clip-path: polygon(
        0 25%, 100% 0, 75% 50%,
        100% 100%, 0 75%, 25% 50%
    );
}

@keyframes wingPulse {
    from {
        opacity: .45;
        transform: scaleX(.8);
    }
    to {
        opacity: 1;
        transform: scaleX(1);
    }
}

.label {
    font-size: 10px;
    letter-spacing: 3px;
    color: #a5d9bf;
}

.number {
    margin: 4px 0;
    font-size: 60px;
    line-height: 1.05;
    font-weight: 900;
    color: var(--green);
    text-shadow:
        0 0 12px #00ff80,
        0 0 35px #00ff8070;
    overflow-wrap: anywhere;
}

.number.rolling {
    animation: numberGlow .12s infinite alternate;
}

.number.pop {
    animation: pop .6s ease-out;
}

@keyframes numberGlow {
    from {
        opacity: .65;
        transform: scale(.96);
    }
    to {
        opacity: 1;
        transform: scale(1.04);
    }
}

@keyframes pop {
    0% {
        opacity: 0;
        transform: scale(.2) rotate(-10deg);
    }
    65% {
        opacity: 1;
        transform: scale(1.15) rotate(3deg);
    }
    100% {
        transform: scale(1) rotate(0);
    }
}

.prediction {
    display: inline-block;
    min-width: 150px;
    max-width: 100%;
    padding: 6px 12px;
    border: 2px solid var(--green);
    border-radius: 10px;
    color: var(--green);
    background: #00ff8012;
    box-shadow: 0 0 25px #00ff8030;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 3px;
    transition: .3s;
}

.prediction.red {
    color: #ff496a;
    border-color: #ff496a;
    background: #ff174412;
    box-shadow: 0 0 25px #ff174430;
}

.prediction.green {
    color: #00ff80;
    border-color: #00ff80;
    background: #00ff8012;
}

.prediction.violet {
    color: #c68aff;
    border-color: #c68aff;
    background: #9b42ff12;
    box-shadow: 0 0 25px #9b42ff30;
}

.result-caption {
    margin-top: 4px;
    font-size: 9px;
    line-height: 1.2;
    color: #8ea5b7;
    letter-spacing: 1px;
}

.popup {
    position: relative;
    margin-top: 6px;
    padding: 8px 10px;
    border: 2px solid #00eaff70;
    border-radius: 12px;
    background: linear-gradient(120deg, #06333b, #071827);
    text-align: center;
    opacity: .7;
    transform: scale(.97);
    transition: .3s;
}

.popup.show {
    opacity: 1;
    transform: scale(1);
    box-shadow:
        0 0 25px #00eaff25,
        inset 0 0 20px #00eaff08;
    animation: popupIn .5s ease;
}

@keyframes popupIn {
    0% {
        transform: translateY(12px) scale(.92);
    }
    100% {
        transform: translateY(0) scale(1);
    }
}

.popup-title {
    color: var(--cyan);
    font-size: 10px;
    letter-spacing: 2px;
}

.popup-value {
    margin-top: 4px;
    font-size: 16px;
    line-height: 1.2;
    font-weight: 900;
    overflow-wrap: anywhere;
}

.popup-detail {
    margin-top: 2px;
    color: #91b6c5;
    font-size: 10px;
    line-height: 1.2;
}

.controls {
    margin-top: 6px;
}

button {
    width: 100%;
    min-height: 40px;
    padding: 8px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(100deg, #00ff80, #00eaff);
    color: #03120e;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 22px #00ff8025;
    transition: transform .2s;
}

button:active {
    transform: scale(.98);
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.secondary {
    margin-top: 6px;
    min-height: 34px;
    color: #b7d2df;
    border: 1px solid #29414e;
    background: #0a1621;
    box-shadow: none;
    font-size: 10px;
}

.footer {
    margin-top: 4px;
    text-align: center;
    color: #718a99;
    font-size: 8px;
    line-height: 1.3;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="app">

    <header class="header">
        <div class="logo">⚡ S_GOD ⚡</div>

        <div class="subtitle">
            PREMIUM ANIMATION SYSTEM
        </div>

        <div class="badge">
            ✦ NEON EDITION ✦
        </div>
    </header>

    <div class="status">
        <span class="dot"></span>
        <span id="status">SYSTEM READY</span>
    </div>

    <section class="result-card">

        <div class="wings">
            <div class="wing left"></div>
            <div class="label">RESULT</div>
            <div class="wing right"></div>
        </div>

        <div class="label">NUMBER DISPLAY</div>

        <div class="number" id="number">?</div>

        <div class="prediction" id="prediction">
            READY
        </div>

        <div class="result-caption" id="caption">
            PRESS START TO PLAY ANIMATION
        </div>

    </section>

    <section class="popup" id="popup">

        <div class="popup-title">
            ✦ RESULT SHOWCASE ✦
        </div>

        <div class="popup-value" id="popupValue">
            Waiting for animation
        </div>

        <div class="popup-detail" id="popupDetail">
            Number and colour visual demo
        </div>

    </section>

    <div class="controls">

        <button id="startBtn" type="button">
            ⚡ START ANIMATION
        </button>

        <button class="secondary" id="resetBtn" type="button">
            ↻ RESET
        </button>

    </div>

    <footer class="footer">
        S_GOD • NEON ANIMATION UI<br>
        VISUAL DEMO ONLY — NOT A REAL PREDICTION
    </footer>

</main>

<script>
"use strict";

const numberEl = document.getElementById("number");
const predictionEl = document.getElementById("prediction");
const statusEl = document.getElementById("status");
const captionEl = document.getElementById("caption");
const popupEl = document.getElementById("popup");
const popupValueEl = document.getElementById("popupValue");
const popupDetailEl = document.getElementById("popupDetail");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");

let running = false;
let intervalId = null;

function setNumberStyle(number) {
    predictionEl.classList.remove(
        "red",
        "green",
        "violet"
    );

    let colour;

    if ([1, 3, 7, 9].includes(number)) {
        colour = "GREEN";
        predictionEl.classList.add("green");
    } else if ([2, 4, 6, 8].includes(number)) {
        colour = "RED";
        predictionEl.classList.add("red");
    } else {
        colour = "VIOLET";
        predictionel.classList.add("violet");
    }

    const size = number >= 5 ? "BIG" : "SMALL";

    return { colour, size };
}

function startAnimation() {
    if (running) return;

    running = true;

    startBtn.disabled = true;
    resetBtn.disabled = true;

    statusEl.textContent = "ANIMATION RUNNING...";
    captionEl.textContent = "GENERATING VISUAL EFFECTS...";

    popupEl.classList.remove("show");

    predictionEl.textContent = "LOADING";
    popupValueEl.textContent = "Please wait...";
    popupDetailEl.textContent =
        "Number animation in progress";

    numberEl.classList.remove("pop");
    numberEl.classList.add("rolling");

    let ticks = 0;
    const maxTicks = 30;

    intervalId = setInterval(() => {
        const n = Math.floor(Math.random() * 10);

        numberEl.textContent = n;
        ticks++;

        if (ticks >= maxTicks) {
            clearInterval(intervalId);
            intervalId = null;

            const finalNumber =
                Math.floor(Math.random() * 10);

            const result = setNumberStyle(finalNumber);

            numberEl.textContent = finalNumber;

            numberEl.classList.remove("rolling");
            numberEl.classList.remove("pop");

            void numberEl.offsetWidth;

            numberEl.classList.add("pop");

            predictionEl.textContent = result.size;

            popupValueEl.textContent =
                result.size + " • " + result.colour;

            popupDetailEl.textContent =
                "Demo number: " + finalNumber +
                " | Visual result only";

            captionEl.textContent =
                "NUMBER " + finalNumber +
                " • DEMO RESULT";

            statusEl.textContent =
                "ANIMATION COMPLETE";

            popupEl.classList.add("show");

            startBtn.disabled = false;
            resetBtn.disabled = false;

            startBtn.textContent = "↻ PLAY AGAIN";

            running = false;
        }
    }, 90);
}

function resetAnimation() {
    if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
    }

    running = false;

    numberEl.classList.remove("rolling", "pop");

    predictionEl.classList.remove(
        "red",
        "green",
        "violet"
    );

    numberEl.textContent = "?";
    predictionEl.textContent = "READY";

    statusEl.textContent = "SYSTEM READY";

    captionEl.textContent =
        "PRESS START TO PLAY ANIMATION";

    popupValueEl.textContent =
        "Waiting for animation";

    popupDetailEl.textContent =
        "Number and colour visual demo";

    popupEl.classList.remove("show");

    startBtn.disabled = false;
    resetBtn.disabled = false;

    startBtn.textContent = "⚡ START ANIMATION";
}

startBtn.addEventListener("click", startAnimation);
resetBtn.addEventListener("click", resetAnimation);
</script>

</body>
</html>
