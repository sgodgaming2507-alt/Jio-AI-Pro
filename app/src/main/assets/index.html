<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030711">

<title>VIP S_God Predictor</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --green: #00ff80;
    --cyan: #00eaff;
    --bg: #030711;
}

body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.app {
    position: relative;
    isolation: isolate;
    width: 414px;
    height: 460px; /* Height 460px set ki hai */
    padding: 10px 12px;
    overflow: hidden;
    border: 2px solid #00ff8070;
    border-radius: 20px;
    background: linear-gradient(160deg, #081727, #050a14 65%);
    box-shadow:
        0 0 25px #00ff8030,
        inset 0 0 25px #00ff8008;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.header {
    text-align: center;
    padding: 2px 0;
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--green);
    text-shadow: 0 0 8px #00ff80;
}

.subtitle {
    font-size: 8px;
    letter-spacing: 1.5px;
    color: #9cb8c7;
}

.badge {
    display: none; /* Jagah bachane ke liye badge hide kiya hai */
}

.status {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 4px;
    margin-bottom: 4px;
    border: 1px solid #1a3c48;
    border-radius: 6px;
    background: #06121c;
    font-size: 9px;
    color: #b3cad6;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
}

.result-card {
    position: relative;
    padding: 6px 6px;
    text-align: center;
    border: 1.5px solid #00ff8055;
    border-radius: 12px;
    background: #06111a;
    overflow: hidden;
}

.wings {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
}

.wing {
    width: 40px;
    height: 16px;
    border-top: 2px solid var(--green);
    border-bottom: 1px solid #00ff8070;
    background: linear-gradient(180deg, #00ff8035, transparent);
}

.wing.left {
    clip-path: polygon(0 0, 100% 25%, 75% 50%, 100% 75%, 0 100%, 25% 50%);
}

.wing.right {
    clip-path: polygon(0 25%, 100% 0, 75% 50%, 100% 100%, 0 75%, 25% 50%);
}

.label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #a5d9bf;
}

.number {
    margin: 2px 0;
    font-size: 48px; /* Size compact ki hai taaki fit aaye */
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 10px #00ff80;
}

.number.rolling {
    animation: numberGlow .12s infinite alternate;
}

.number.pop {
    animation: pop .5s ease-out;
}

@keyframes numberGlow {
    from { opacity: .65; transform: scale(.96); }
    to { opacity: 1; transform: scale(1.04); }
}

@keyframes pop {
    0% { opacity: 0; transform: scale(.2); }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.prediction {
    display: inline-block;
    min-width: 130px;
    padding: 4px 10px;
    border: 1.5px solid var(--green);
    border-radius: 8px;
    color: var(--green);
    background: #00ff8012;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2px;
}

.prediction.red { color: #ff496a; border-color: #ff496a; background: #ff174412; }
.prediction.green { color: #00ff80; border-color: #00ff80; background: #00ff8012; }
.prediction.violet { color: #c68aff; border-color: #c68aff; background: #9b42ff12; }

.result-caption {
    margin-top: 2px;
    font-size: 8px;
    color: #8ea5b7;
}

.popup {
    margin-top: 4px;
    padding: 6px 8px;
    border: 1px solid #00eaff70;
    border-radius: 10px;
    background: #071827;
    text-align: center;
    opacity: .8;
}

.popup.show {
    opacity: 1;
}

.popup-title {
    color: var(--cyan);
    font-size: 9px;
    letter-spacing: 1px;
}

.popup-value {
    margin-top: 2px;
    font-size: 13px;
    font-weight: 900;
}

.popup-detail {
    font-size: 9px;
    color: #91b6c5;
}

.controls {
    margin-top: 4px;
}

button {
    width: 100%;
    min-height: 36px;
    padding: 6px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(100deg, #00ff80, #00eaff);
    color: #03120e;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
}

.secondary {
    margin-top: 4px;
    min-height: 30px;
    color: #b7d2df;
    border: 1px solid #29414e;
    background: #0a1621;
    font-size: 10px;
}

.footer {
    margin-top: 2px;
    text-align: center;
    color: #718a99;
    font-size: 7px;
}
</style>
</head>

<body>

<main class="app">

    <header class="header">
        <div class="logo">⚡ S_GOD ⚡</div>
        <div class="subtitle">PREMIUM ANIMATION SYSTEM</div>
    </header>

    <div class="status">
        <span class="dot"></span>
        <span id="status">SYSTEM READY</span>
    </div>

    <section class="result-card">
        <div class="wings">
            <div class="wing left"></div>
            <div class="label">RESULT</div>
            <div class="wing right"></div>
        </div>

        <div class="label">NUMBER DISPLAY</div>
        <div class="number" id="number">?</div>
        <div class="prediction" id="prediction">READY</div>
        <div class="result-caption" id="caption">PRESS START TO PLAY ANIMATION</div>
    </section>

    <section class="popup" id="popup">
        <div class="popup-title">✦ RESULT SHOWCASE ✦</div>
        <div class="popup-value" id="popupValue">Waiting for animation</div>
        <div class="popup-detail" id="popupDetail">Number and colour visual demo</div>
    </section>

    <div class="controls">
        <button id="startBtn" type="button">⚡ START ANIMATION</button>
        <button class="secondary" id="resetBtn" type="button">↻ RESET</button>
    </div>

    <footer class="footer">S_GOD • NEON ANIMATION UI</footer>

</main>

<script>
"use strict";

const numberEl = document.getElementById("number");
const predictionEl = document.getElementById("prediction");
const statusEl = document.getElementById("status");
const captionEl = document.getElementById("caption");
const popupEl = document.getElementById("popup");
const popupValueEl = document.getElementById("popupValue");
const popupDetailEl = document.getElementById("popupDetail");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");

let running = false;
let intervalId = null;

function setNumberStyle(number) {
    predictionEl.classList.remove("red", "green", "violet");
    let colour;

    if ([1, 3, 7, 9].includes(number)) {
        colour = "GREEN";
        predictionEl.classList.add("green");
    } else if ([2, 4, 6, 8].includes(number)) {
        colour = "RED";
        predictionEl.classList.add("red");
    } else {
        colour = "VIOLET";
        predictionEl.classList.add("violet");
    }

    const size = number >= 5 ? "BIG" : "SMALL";
    return { colour, size };
}

function startAnimation() {
    if (running) return;
    running = true;

    startBtn.disabled = true;
    resetBtn.disabled = true;

    statusEl.textContent = "ANIMATION RUNNING...";
    captionEl.textContent = "GENERATING VISUAL EFFECTS...";
    popupEl.classList.remove("show");

    predictionEl.textContent = "LOADING";
    popupValueEl.textContent = "Please wait...";
    popupDetailEl.textContent = "Number animation in progress";

    numberEl.classList.remove("pop");
    numberEl.classList.add("rolling");

    let ticks = 0;
    const maxTicks = 30;

    intervalId = setInterval(() => {
        const n = Math.floor(Math.random() * 10);
        numberEl.textContent = n;
        ticks++;

        if (ticks >= maxTicks) {
            clearInterval(intervalId);
            intervalId = null;

            const finalNumber = Math.floor(Math.random() * 10);
            const result = setNumberStyle(finalNumber);

            numberEl.textContent = finalNumber;
            numberEl.classList.remove("rolling");
            numberEl.classList.remove("pop");
            void numberEl.offsetWidth;
            numberEl.classList.add("pop");

            predictionEl.textContent = result.size;
            popupValueEl.textContent = result.size + " • " + result.colour;
            popupDetailEl.textContent = "Demo number: " + finalNumber + " | Visual result only";
            captionEl.textContent = "NUMBER " + finalNumber + " • DEMO RESULT";
            statusEl.textContent = "ANIMATION COMPLETE";
            popupEl.classList.add("show");

            startBtn.disabled = false;
            resetBtn.disabled = false;
            startBtn.textContent = "↻ PLAY AGAIN";
            running = false;
        }
    }, 90);
}

function resetAnimation() {
    if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
    }
    running = false;
    numberEl.classList.remove("rolling", "pop");
    predictionEl.classList.remove("red", "green", "violet");
    numberEl.textContent = "?";
    predictionEl.textContent = "READY";
    statusEl.textContent = "SYSTEM READY";
    captionEl.textContent = "PRESS START TO PLAY ANIMATION";
    popupValueEl.textContent = "Waiting for animation";
    popupDetailEl.textContent = "Number and colour visual demo";
    popupEl.classList.remove("show");
    startBtn.disabled = false;
    resetBtn.disabled = false;
    startBtn.textContent = "⚡ START ANIMATION";
}

startBtn.addEventListener("click", startAnimation);
resetBtn.addEventListener("click", resetAnimation);
</script>

</body>
</html>
