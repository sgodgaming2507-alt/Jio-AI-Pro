<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIP S_GOD Predictor</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --green: #00ff80;
    --cyan: #00eaff;
    --bg: #030711;
}

body {
    min-height: 100vh;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent; /* Overlay ke liye transparent background */
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.app {
    position: relative;
    width: 100%;
    max-width: 320px;
    padding: 15px;
    overflow: hidden;
    border: 2px solid var(--green);
    border-radius: 20px;
    background: linear-gradient(160deg, #081727, #050a14 65%);
    box-shadow: 0 0 25px rgba(0, 255, 128, 0.4);
}

.close-btn {
    position: absolute;
    right: 15px;
    top: 12px;
    color: var(--green);
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
}

.header {
    position: relative;
    text-align: center;
    padding: 5px 0 10px;
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--green);
    text-shadow: 0 0 10px #00ff80;
}

.subtitle {
    margin-top: 4px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #9cb8c7;
}

.status {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 8px;
    margin-bottom: 10px;
    border: 1px solid #1a3c48;
    border-radius: 8px;
    background: #06121c;
    font-size: 10px;
    letter-spacing: 1px;
    color: #b3cad6;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
}

.result-card {
    position: relative;
    padding: 15px 10px;
    text-align: center;
    border: 1px solid #00ff8055;
    border-radius: 14px;
    background: #06111a;
}

.label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #a5d9bf;
}

.number {
    margin: 8px 0;
    font-size: 60px;
    line-height: 1;
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 10px #00ff80;
}

.number.rolling {
    animation: numberGlow .12s infinite alternate;
}

@keyframes numberGlow {
    from { opacity: .65; transform: scale(.96); }
    to { opacity: 1; transform: scale(1.04); }
}

.prediction {
    display: inline-block;
    min-width: 130px;
    padding: 8px 15px;
    border: 1px solid var(--green);
    border-radius: 8px;
    color: var(--green);
    background: #00ff8012;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;
}

.prediction.red {
    color: #ff496a;
    border-color: #ff496a;
    background: #ff174412;
}

.prediction.green {
    color: #00ff80;
    border-color: #00ff80;
    background: #00ff8012;
}

.result-caption {
    margin-top: 8px;
    font-size: 9px;
    color: #8ea5b7;
}

.popup {
    margin-top: 10px;
    padding: 8px;
    border: 1px solid #00eaff60;
    border-radius: 8px;
    background: #071827;
    text-align: center;
    font-size: 10px;
    color: var(--cyan);
}

.controls {
    margin-top: 12px;
}

button {
    width: 100%;
    min-height: 40px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(100deg, #00ff80, #00eaff);
    color: #03120e;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0,255,128,0.3);
}

button:active {
    transform: scale(.98);
}
</style>
</head>

<body>

<main class="app">
    <div class="close-btn" onclick="closeApp()">×</div>

    <header class="header">
        <div class="logo">⚡ S_GOD ⚡</div>
        <div class="subtitle">VIP 1-MIN PREDICTOR</div>
    </header>

    <div class="status">
        <span class="dot"></span>
        <span id="status">SYSTEM READY</span>
    </div>

    <section class="result-card">
        <div class="label">PREDICTED NUMBER</div>
        <div class="number" id="number">?</div>
        <div class="prediction green" id="prediction">READY</div>
        <div class="result-caption" id="caption">PRESS START HACK TO ANALYZE</div>
    </section>

    <section class="popup" id="popup">
        <div id="periodText">PERIOD: --</div>
    </section>

    <div class="controls">
        <button id="startBtn" type="button" onclick="startHack()">
            ⚡ START HACK ⚡
        </button>
    </div>
</main>

<script>
"use strict";

let lastPeriod = "";

function updatePeriod() {
    let now = new Date();
    let year = now.getFullYear();
    let month = String(now.getMonth() + 1).padStart(2, '0');
    let day = String(now.getDate()).padStart(2, '0');
    
    let totalMinutes = now.getHours() * 60 + now.getMinutes();
    let periodIndex = totalMinutes + 1;
    let paddedIndex = String(periodIndex).padStart(4, '0');
    let periodCode = year + month + day + "1000" + paddedIndex;

    document.getElementById('periodText').innerText = "PERIOD: " + periodCode;
    return periodCode;
}

setInterval(updatePeriod, 1000);
updatePeriod();

function startHack() {
    let currentFullPeriod = updatePeriod();

    if (currentFullPeriod === lastPeriod) {
        try { Android.showToast("Please wait for next period!"); } catch(e) {}
        return;
    }

    let startBtn = document.getElementById("startBtn");
    let numberEl = document.getElementById("number");
    let predictionEl = document.getElementById("prediction");
    let statusEl = document.getElementById("status");
    let captionEl = document.getElementById("caption");

    startBtn.disabled = true;
    statusEl.textContent = "ANALYZING 1-MIN...";
    captionEl.textContent = "HACKING SERVER...";
    numberEl.classList.add("rolling");

    let ticks = 0;
    const maxTicks = 15;

    const interval = setInterval(() => {
        numberEl.textContent = Math.floor(Math.random() * 10);
        ticks++;

        if (ticks >= maxTicks) {
            clearInterval(interval);
            
            // Real 1-min calculation based on period last digit
            let lastDigit = parseInt(currentFullPeriod.slice(-1));
            let size = (lastDigit >= 5) ? "BIG" : "SMALL";
            let colorClass = (lastDigit >= 5) ? "green" : "red";

            numberEl.textContent = lastDigit;
            numberEl.classList.remove("rolling");

            predictionEl.className = "prediction " + colorClass;
            predictionEl.textContent = size + " (" + lastDigit + ")";

            captionEl.textContent = "SUCCESS • HACK APPLIED";
            statusEl.textContent = "READY FOR NEXT";

            startBtn.disabled = false;
            lastPeriod = currentFullPeriod;
        }
    }, 100);
}

function closeApp() {
    try {
        Android.closeMenu();
    } catch(e) {
        window.close();
    }
}
</script>

</body>
</html>
