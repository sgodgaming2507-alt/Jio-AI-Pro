<script>
    function updateGame() {
        let now = new Date();
        
        // Date format: YYYYMMDD
        let year = now.getFullYear();
        let month = String(now.getMonth() + 1).padStart(2, '0');
        let day = String(now.getDate()).padStart(2, '0');
        let datePart = `${year}${month}${day}`;
        
        // Din ke total minutes nikal kar period number ka sequence banate hain
        let totalMinutesToday = (now.getHours() * 60) + now.getMinutes();
        let periodNumber = datePart + "1000" + (11000 + totalMinutesToday);
        
        document.getElementById('period_text').innerText = "PERIOD: " + periodNumber;
        
        // 1 minute ka unique seed banate hain taaki prediction 1 minute tak change na ho
        let minuteSeed = Math.floor(now.getTime() / 60000);
        let pseudoRandom = Math.sin(minuteSeed) * 10000;
        let isBig = (pseudoRandom - Math.floor(pseudoRandom)) > 0.5;
        
        let prediction = isBig ? "BIG" : "SMALL";
        let color = (prediction === "BIG") ? "#39ff14" : "#ff0000";
        
        let resCircle = document.getElementById('result-circle');
        resCircle.innerHTML = prediction;
        resCircle.style.display = 'flex';
        resCircle.style.borderColor = color;
        resCircle.style.color = color;
        resCircle.style.boxShadow = "0 0 20px " + color;
    }

    function handleHack() {
        document.getElementById('hack_btn').style.display = 'none';
        document.getElementById('result-circle').style.display = 'none';
        document.getElementById('loader-area').style.display = 'block';

        setTimeout(() => {
            document.getElementById('loader-area').style.display = 'none';
            updateGame();
            document.getElementById('hack_btn').style.display = 'block';
        }, 1500);
    }

    // Page load hote hi current period aur prediction set ho jayegi
    window.onload = function() {
        updateGame();
    };
</script>
