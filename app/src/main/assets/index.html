<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jio AI Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .panel {
            width: 270px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            text-align: center;
        }
        .header {
            font-size: 13px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .period {
            font-size: 11px;
            color: #ffcc00;
            margin-bottom: 6px;
        }
        .result-box {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #444;
        }
        .big-small {
            font-size: 18px;
            font-weight: bold;
            color: #ff00ff;
            margin-bottom: 2px;
        }
        .digit {
            font-size: 22px;
            font-weight: bold;
            color: #00ffff;
        }
        .status {
            font-size: 9px;
            color: #00ff00;
            margin-bottom: 6px;
        }
        button {
            width: 100%;
            padding: 5px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 10px;
            background: #ff4444;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="header">JIO AI PRO</div>
        <div class="period" id="periodText">PER: Loading...</div>
        
        <div class="result-box">
            <div class="big-small" id="predictionText">WAIT...</div>
            <div style="font-size: 9px; color: #aaa;">LUCKY DIGIT</div>
            <div class="digit" id="digitText">-</div>
        </div>

        <div class="status">Status: Active & Synced</div>
        <button onclick="exitApp()">EXIT</button>
    </div>

    <script>
        function updatePanel() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const istTime = new Date(utc + (3600000 * 5.5));

            const year = istTime.getFullYear();
            const month = String(istTime.getMonth() + 1).padStart(2, '0');
            const day = String(istTime.getDate()).padStart(2, '0');
            
            const hours = istTime.getHours();
            const minutes = istTime.getMinutes();
            const totalMins = (hours * 60) + minutes;

            const periodSeq = 10000 + totalMins + 1;
            const periodCode = `${year}${month}${day}1000${periodSeq}`;

            document.getElementById("periodText").innerText = `PER: ${periodCode}`;

            const lastDigit = parseInt(periodCode.slice(-1));
            const isBig = lastDigit >= 5;

            document.getElementById("predictionText").innerText = isBig ? "BIG" : "SMALL";
            document.getElementById("digitText").innerText = lastDigit;
        }

        updatePanel();
        setInterval(updatePanel, 1000);

        function exitApp() {
            if (window.Android && window.Android.closeApp) {
                window.Android.closeApp();
            }
        }
    </script>
</body>
</html>
